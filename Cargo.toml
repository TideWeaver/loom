[workspace]
members = ["loom", "loom-cli"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
snafu = "0.8.6"
tokio = { version = "1.0", features = ["full"] }
arrow = "55.0.0"
arrow-array = { version = "55.2.0" }
arrow-flight = { version = "55.0.0", features = [
  "flight-sql-experimental",
  "tls",
] }
arrow-ipc = { version = "55.0.0" }
arrow-schema = { version = "55.2.0", features = ["serde"] }
arrow-json = "55.0.0"
arrow-odbc = { version = "16.0.2" }
datafusion = { version = "48", default-features = false }
parquet = { version = "55.0.0" }

# Configuration for cargo-dist
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI
cargo-dist-version = "0.10.0"
# CI backends to support
ci = ["github"]
# Target platforms to build for
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Publish jobs to run in CI
pr-run-mode = "skip"
# Whether to install an updater program
install-updater = false

# The archive format to use
unix-archive = ".tar.gz"
windows-archive = ".zip"

# Build only the binary we care about
precise-builds = true

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "buildjet-2vcpu-ubuntu-2204-arm"
aarch64-unknown-linux-musl = "buildjet-2vcpu-ubuntu-2204-arm"