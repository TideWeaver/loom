[package]
edition = "2024"
name = "loom"
version = "0.0.1"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5.38", features = ["derive", "cargo"] }
config = "0.15.11"
datafusion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true }

[dev-dependencies]
dotenvy = "0.15"
serde_yaml = "0.9"
tempfile = "3.8"

[[test]]
harness = false
name = "it"

[[example]]
name = "datafusion_query"
path = "../examples/datafusion_query.rs"
