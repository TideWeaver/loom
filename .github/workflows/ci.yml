name: CI - Lint & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master, develop, feature-*, feat-*, fix-*, bug-*]

# Cancel previous runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  rust_msrv: "stable"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust Builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.rust_msrv }}
      
      # Install additional tools
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli,taplo-cli
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Check typos
        run: typos
      
      - name: Check TOML formatting
        run: taplo check
      
      - name: Check documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust Builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.rust_msrv }}
      
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      
      - name: Build debug
        run: cargo build --verbose --all-features --target ${{ matrix.target }}
      
      - name: Build release
        run: cargo build --release --verbose --all-features --target ${{ matrix.target }}
      
      - name: Verify binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            test -f target/${{ matrix.target }}/release/data-loom.exe
          else
            test -f target/${{ matrix.target }}/release/data-loom
          fi
      
      # Upload artifacts for later use
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: data-loom-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/data-loom
            target/${{ matrix.target }}/release/data-loom.exe
          retention-days: 1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust Builder
        uses: ./.github/actions/setup-builder
        with:
          rust-version: ${{ env.rust_msrv }}
      
      - name: Run cargo audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Optional: cargo-deny for more comprehensive checks
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v1
        continue-on-error: true
        with:
          log-level: warn
          command: check
          arguments: --all-features

  # Required status check
  required:
    name: All checks passed
    runs-on: ubuntu-latest
    if: always()
    needs: [check, build, security]
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.check.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" ]]; then
            echo "Some required jobs failed"
            exit 1
          fi
          echo "All required jobs passed successfully"